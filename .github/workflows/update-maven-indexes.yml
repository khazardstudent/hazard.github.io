name: Update Maven Indexes

on:
  push:
    branches: [main]
    paths:
      - "maven/**"
      - "scripts/generate-indexes.sh"
      - ".github/workflows/update-maven-indexes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-indexes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate index files
        run: |
          chmod +x scripts/generate-indexes.sh
          scripts/generate-indexes.sh maven

      - name: Commit updated indexes
        run: |
          if [[ -z "$(git status --porcelain maven)" ]]; then
            echo "No index changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maven
          git commit -m "chore: update maven indexes"
          git push
